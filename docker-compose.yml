name: scorecard-be

services:
  app:
    image: iblgroup/searle-scorecard-be:1.0.0
    container_name: searle-scorecard-be
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    # Host nginx (HTTPS) is the only public entry; bind localhost so ports are
    # not reachable from the network.
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ./logs:/app/logs
